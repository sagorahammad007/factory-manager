<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--bg:#eceff1;--surface:#fff;--ink:#14171a;--mute:#5a636b;--line:#cfd5da;--accent:#f5b800;--dark:#14171a;--field:#fff;--red:#c62f26;--green:#1f8a4c;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101214;--surface:#1a1e22;--ink:#f2f4f5;--mute:#9aa4ad;--line:#2c3238;--dark:#0b0c0e;--field:#12151a;--red:#ff6b61;--green:#4cd185}}
:root[data-theme="dark"]{--bg:#101214;--surface:#1a1e22;--ink:#f2f4f5;--mute:#9aa4ad;--line:#2c3238;--dark:#0b0c0e;--field:#12151a;--red:#ff6b61;--green:#4cd185}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,Arial,sans-serif;line-height:1.45}
h1,h2,h3,.logo{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:10;background:var(--dark);color:#f2f4f5;border-bottom:4px solid var(--accent)}
header .wrap{display:flex;align-items:center;gap:10px;height:56px}
#bk{background:none;border:2px solid var(--accent);color:var(--accent);font:700 1rem "Barlow Condensed",Arial,sans-serif;padding:4px 10px;cursor:pointer;text-transform:uppercase}
#tt{font:800 1.35rem "Barlow Condensed",Arial,sans-serif;text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding-top:16px;padding-bottom:70px}
h2{font-size:1.8rem;margin-bottom:10px}h3{font-size:1.1rem;margin:18px 0 8px;color:var(--mute)}
input,select{width:100%;padding:10px;font:inherit;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:0}
input:focus,select:focus{outline:2px solid var(--accent)}
.btn{display:inline-block;background:var(--accent);color:#14171a;font:700 1rem "Barlow Condensed",Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em;padding:10px 16px;border:0;cursor:pointer}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--dark)}
.btn.full{width:100%;margin-top:10px}
.btn.sm{padding:6px 12px;font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);padding:12px;margin-bottom:12px}
.co .btns{display:flex;gap:8px;margin-top:8px}.co .btns .btn{flex:1}
.nm{font:700 1.2rem "Barlow Condensed",Arial,sans-serif;text-transform:uppercase}
.big{display:block;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:8px solid var(--accent);padding:18px;margin-bottom:12px;cursor:pointer;font:800 1.6rem "Barlow Condensed",Arial,sans-serif;text-transform:uppercase}
.big small{display:block;font:500 .9rem Barlow,Arial,sans-serif;text-transform:none;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tile{background:var(--surface);border:1px solid var(--line);padding:8px 10px}
.tile small{color:var(--mute);text-transform:uppercase;font-size:.7rem;font-weight:600}
.tile b{display:block;font:800 1.2rem "Barlow Condensed",Arial,sans-serif}
.pos{color:var(--green)}.neg{color:var(--red)}
.sheet{overflow-x:auto;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{background:var(--dark);color:var(--accent);font:700 .85rem "Barlow Condensed",Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:8px 6px;position:sticky;top:0}
td{border-top:1px solid var(--line);padding:2px}
td input{border:0;background:transparent;padding:8px 6px}
td.r{text-align:right;padding:8px 6px;white-space:nowrap}
tr.tot td{font-weight:800;background:var(--bg);padding:8px 6px}
.x{background:none;border:0;color:var(--red);font-size:1.2rem;cursor:pointer;padding:6px 8px}
.tabs{display:flex;margin-bottom:12px}
.tab{flex:1;font:800 1.05rem "Barlow Condensed",Arial,sans-serif;text-transform:uppercase;padding:10px;background:var(--surface);color:var(--ink);border:2px solid var(--dark);cursor:pointer}
.tab.on{background:var(--dark);color:var(--accent)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g2 label,.f label{display:block;font-size:.75rem;font-weight:600;color:var(--mute)}
.adj{display:flex;gap:6px;margin-top:8px}.adj input{flex:1}
.q{font:800 1.6rem "Barlow Condensed",Arial,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.arow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.arow .s{display:flex;gap:4px}
.s button{width:40px;height:40px;border:2px solid var(--line);background:var(--field);color:var(--ink);font:800 1rem "Barlow Condensed",Arial,sans-serif;cursor:pointer}
.s button.on{border-color:var(--dark);color:#14171a}
.s button.on[data-s=P]{background:#4cd185}.s button.on[data-s=A]{background:#ff6b61}.s button.on[data-s=L]{background:#f5b800}.s button.on[data-s=H]{background:#8ec5ff}
.note{color:var(--mute);font-size:.85rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--dark);color:#fff;padding:10px 18px;z-index:50;border-left:4px solid var(--accent)}
body.co{--bg:#0b0e11;--surface:rgba(18,24,30,.84);--ink:#f2f4f5;--mute:#9aa4ad;--line:#2c3238;--field:#12151a;--red:#ff6b61;--green:#4cd185}
body.co .tab{background:rgba(18,24,30,.84);color:#f2f4f5;border-color:#2c3238}
#cv{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:none;pointer-events:none}
body.co #cv{display:block}
main{position:relative;z-index:1}
[data-lp]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;cursor:pointer}
.ct{font-size:2rem}.ct small{display:block;font:500 .9rem Barlow,Arial,sans-serif;text-transform:none;color:var(--mute);letter-spacing:0}
.tick{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(11,14,17,.8);margin:10px -14px 16px;padding:7px 0}
.trk{display:inline-flex;animation:tk 28s linear infinite}
.ti{margin:0 22px;font:700 1rem "Barlow Condensed",Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em}
.ti i{font-style:normal}.ti u{text-decoration:none;color:var(--mute);margin-left:8px}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.trk{animation:none}}
.kp{color:var(--mute);font-size:.9rem;margin-top:2px}
.chip{display:inline-block;margin:0 6px 6px 0;padding:8px 12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--accent);cursor:pointer;font:600 .95rem Barlow,Arial,sans-serif}
.chip small{color:var(--mute);margin-left:6px}
.ln{position:relative;border-top:1px solid var(--line);padding:10px 34px 10px 0}
.ln .x{position:absolute;right:0;top:6px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-top:4px}
.g3 label,.g2 label{display:block;font-size:.75rem;font-weight:600;color:var(--mute)}
.lt{font-weight:800;text-align:right;padding-bottom:10px}
details.card summary{cursor:pointer;font:800 1.1rem "Barlow Condensed",Arial,sans-serif;text-transform:uppercase}
details.card[open] summary{margin-bottom:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:var(--surface);color:var(--ink);border-left:6px solid var(--red);padding:20px;max-width:360px;width:100%;display:grid;gap:10px}
.dlg p{margin:0;font-size:1.1rem}
.btn.red{background:var(--red);color:#fff}
.lk{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit}
.mvb{display:flex;gap:6px}
.mvb button{border:2px solid var(--dark);background:var(--accent);color:#14171a;font-weight:800;width:40px;height:40px;cursor:pointer}
#rcpt{background:#fff;color:#111;border:2px solid #111;padding:20px;font-size:14px;font-family:sans-serif;line-height:1.4;max-width:800px;margin:0 auto;}
#rcpt h2{margin:0 0 5px 0;text-align:center;font-size:22px;color:#111}
#rcpt h3{margin:0 0 10px 0;text-align:center;font-size:16px;color:#111}
#rcpt .header{border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:15px;text-align:center}
#rcpt table{width:100%;border-collapse:collapse;margin-bottom:10px;min-width:0}
#rcpt th{background:#eee;color:#111;border:1px solid #111;padding:6px;font-size:12px;text-align:left;position:static}
#rcpt td{border:1px solid #111;padding:6px;font-size:13px}
#rcpt .r{text-align:right}
#rcpt .totals{width:50%;margin-left:auto;border-collapse:collapse}
#rcpt .totals td{border:0;padding:4px}
#rcpt .totals tr.grand td{border-top:2px solid #111;font-weight:bold;font-size:16px}
@media print{body *{visibility:hidden}#rcpt,#rcpt *{visibility:visible}#rcpt{position:absolute;left:0;top:0;width:100%;border:0}#rcpt .actions{display:none}}
#tick{margin:0}body.co .tab.on{background:var(--accent);color:#14171a;border-color:var(--accent)}#cv{opacity:.28}body.front #cv{opacity:1}body.co .btn.alt{border-color:#39414a}
body.co{color-scheme:dark;--line:#3d4852}
body.co input,body.co select,body.co textarea{background:transparent;border:1.5px solid #8793a0;color:#f2f4f5}
body.co input::placeholder{color:#a3adb6;opacity:1}
body.co input:focus,body.co select:focus,body.co textarea:focus{border-color:var(--accent);outline:2px solid var(--accent);background:rgba(245,184,0,.07)}
body.co td input,body.co td select{border:1px solid #6b7782;margin:2px;width:calc(100% - 4px);padding:8px 6px}
body.co option{background:#1a1e22;color:#f2f4f5}
body.co .btn.alt,body.co .tab,body.co .s button,body.co .x{border-color:#8793a0}
body.co .card,body.co .sheet,body.co .tile,body.co .item{border-color:#46515c}
body.co .card{border-left-color:var(--accent)}
body.co .item{border-left-color:var(--accent)}
.st{font-size:.8rem;font-weight:600;margin-left:auto;white-space:nowrap}.st.on{color:var(--green)}.st.off{color:#f5b800}
#gate,#lock{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
#gate{z-index:80;background:rgba(8,10,12,.96)}
#lock{z-index:100;background:#0b0e11}
.gc,.lkc{background:#141a20;border:1px solid #46515c;border-left:6px solid var(--accent);padding:20px;max-width:400px;width:100%;color:#f2f4f5;margin:auto}
.gc h2,.lkc h2{margin-bottom:10px}.gc p{margin:8px 0}
.lkl{margin-bottom:8px}
.gerr{color:#ff6b61;font-weight:600}
.gm{margin:10px 0;display:grid;gap:8px}.gm label{display:flex;gap:8px;align-items:center;font-size:.9rem;color:#f2f4f5}
input[type=radio]{width:auto !important;margin:0}
.dots{font-size:1.6rem;letter-spacing:.3em;text-align:center;margin:8px 0;min-height:2rem}
.lkm{color:#ff6b61;text-align:center;min-height:1.4rem;font-size:.9rem}
.kp3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.kp3 button{height:56px;font:700 1.4rem "Barlow Condensed",Arial,sans-serif;background:transparent;color:#f2f4f5;border:1.5px solid #8793a0;cursor:pointer}
.lkf{display:block;margin:14px auto 0;background:none;border:0;color:#9aa4ad;text-decoration:underline;cursor:pointer}
#scanner-modal{position:fixed;inset:0;background:#000;z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;}
#scanner-reader{width:100%;max-width:500px;}
.scan-close{position:absolute;top:20px;right:20px;color:#fff;background:none;border:none;font-size:24px;cursor:pointer}
</style>
</head>
<body>
<header><div class="wrap"><svg id="lg" width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#f5b800"/><rect x="12" y="34" width="10" height="18" rx="3" fill="#14171a"/><rect x="27" y="24" width="10" height="28" rx="3" fill="#14171a"/><rect x="42" y="13" width="10" height="39" rx="3" fill="#14171a"/></svg><button id="bk" hidden>&larr; Back</button><div id="tt">Factory Manager Pro</div><span id="st" class="st"></span></div></header>
<div class="tick" id="tick"></div>
<canvas id="cv"></canvas>
<main class="wrap" id="app"></main>
<div id="dlg"></div>
<div id="gate"></div>
<div id="lock"></div>
<input type="file" id="rf" accept=".json,application/json" hidden>

<div id="scanner-modal">
  <button class="scan-close" onclick="window.stopScanner()">✕</button>
  <h2 style="color:#fff;margin-bottom:20px;font-size:1.2rem;text-align:center;">Scan Barcode / QR</h2>
  <div id="scanner-reader"></div>
</div>

<script src="firebase-config.js"></script>
<script>
(function(){
function $(i){return document.getElementById(i)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fix(c){c.led=c.led||[];c.debt=c.debt||[];c.stk=c.stk||[];c.sal=c.sal||[];c.mov=c.mov||[];c.wrk=c.wrk||[];c.att=c.att||{};c.adv=c.adv||[];c.invNo=c.invNo||1;return c}
function blank(n){return fix({id:uid(),name:n,ts:Date.now()})}
function load(){try{var v=localStorage.getItem('fm_data');return v?JSON.parse(v):null}catch(e){return null}}
var CFG=window.FM_CONFIG||(typeof firebaseConfig!=='undefined'?firebaseConfig:null);
var CLOUDMODE=!!(CFG&&CFG.apiKey&&String(CFG.apiKey).indexOf('PASTE')<0&&CFG.projectId&&String(CFG.projectId).indexOf('PASTE')<0);
var D=load(),LOCALSAVED=null;
if(CLOUDMODE){LOCALSAVED=(D&&D.companies&&D.companies.length)?D:null;D={companies:[]}}
else if(!D||!D.companies||!D.companies.length)D={companies:[blank('MS Recycle Plant'),blank('Brothers Recycle')]};
D.companies.forEach(fix);
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function save(){if(CLOUDMODE){cloudDirty();return}try{localStorage.setItem('fm_data',JSON.stringify(D))}catch(e){toast('Could not save')}}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return '৳ '+(Math.round(n*100)/100).toLocaleString('en-US')}
function dmy(d){var p=String(d).split('-');return p.length==3?p[2]+'-'+p[1]+'-'+p[0]:d}
function num(v){return parseFloat(v)||0}
function pad(n){return ('0000'+n).slice(-4)}
function daysIn(m){return new Date(+m.slice(0,4),+m.slice(5,7),0).getDate()}
function newCart(){return{d:today(),cust:'',phone:'',paid:'',lines:[]}}
var S={v:'co',cid:null,atab:'inc',tab:'stock',wtab:'info',month:today().slice(0,7),date:today(),rd:today(),td:today(),sd:today(),ld:'',lq:'',wsq:'',wid:'',wm:today().slice(0,7),arm:'',q:'',sq:'',dq:'',mv:'',dlg:'',inv:'',cart:newCart()};
function C(){return D.companies.filter(function(c){return c.id===S.cid})[0]}
function armLbl(k){return S.arm===k?'Tap again to delete':'Delete'}
function item(c,id){return c.stk.filter(function(x){return x.id===id})[0]}
function mvAdj(c,it,delta,type,note,d){it.qty=num(it.qty)+delta;c.mov.push({id:uid(),d:d||today(),pid:it.id,name:it.name,unit:it.unit,delta:delta,type:type,note:note||''})}
var TYPES={'in':'Produced / in','out':'Stock out',sale:'Sold',set:'Adjusted',open:'Opening'};
function saleTotal(s){return s.lines.reduce(function(a,l){return a+l.qty*l.price},0)}

var cv=$('cv'),cx=cv.getContext('2d'),raf=0,cands=[],off=0,lt=0,N=44,mql=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)');
function gen(){var p=cands.length?cands[cands.length-1].c:100,c=p+(Math.random()-.47)*5;return{o:p,c:c,h:Math.max(p,c)+Math.random()*2.5,l:Math.min(p,c)-Math.random()*2.5}}
for(var i0=0;i0<N+2;i0++)cands.push(gen());
function draw(){
var dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;
if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
var mn=1e9,mx=-1e9;cands.forEach(function(k){mn=Math.min(mn,k.l);mx=Math.max(mx,k.h)});
var top=H*.14,bot=H*.9,cw=W/N;
function y(v){return bot-(v-mn)/(mx-mn||1)*(bot-top)}
cx.strokeStyle='rgba(255,255,255,.06)';cx.lineWidth=1;
for(var g=1;g<6;g++){var gy=H*g/6;cx.beginPath();cx.moveTo(0,gy);cx.lineTo(W,gy);cx.stroke()}
cands.forEach(function(k,i){var x=i*cw-off+cw/2,up=k.c>=k.o;
cx.strokeStyle=cx.fillStyle=up?'rgba(76,209,133,.5)':'rgba(255,107,97,.5)';
cx.beginPath();cx.moveTo(x,y(k.h));cx.lineTo(x,y(k.l));cx.stroke();
var yo=y(k.o),yc=y(k.c);cx.fillRect(x-cw*.28,Math.min(yo,yc),cw*.56,Math.max(2,Math.abs(yo-yc)))});
cx.strokeStyle='rgba(245,184,0,.8)';cx.lineWidth=2;cx.beginPath();
cands.forEach(function(k,i){var s=0,n=0;for(var j=Math.max(0,i-7);j<=i;j++){s+=cands[j].c;n++}var x=i*cw-off+cw/2,yy=y(s/n);if(i)cx.lineTo(x,yy);else cx.moveTo(x,yy)});
cx.stroke();}
function loop(ts){
var dt=lt?Math.min(ts-lt,60):16;lt=ts;var cw=innerWidth/N;off+=dt*cw/900;
if(off>=cw){off-=cw;cands.shift();cands.push(gen())}
draw();raf=requestAnimationFrame(loop)}
function anim(){if(mql&&mql.matches){draw();return}if(!raf){lt=0;raf=requestAnimationFrame(loop)}}
window.addEventListener('resize',function(){draw()});

function kpi(c){
var m=today().slice(0,7),i=0,e=0;
c.led.forEach(function(r){
    if(r.d && r.d.slice(0,7)===m){i+=num(r.inc);e+=num(r.exp)}
});
return{net:i-e,n:c.stk.length}}

function tickHtml(){var tk='';D.companies.forEach(function(c){var k=kpi(c);tk+='<span class="ti"><b>'+esc(c.name)+'</b> <i class="'+(k.net>=0?'pos':'neg')+'">'+(k.net>=0?'▲':'▼')+' '+money(Math.abs(k.net))+'</i><u>'+k.n+' items</u></span>'});return '<div class="trk">'+tk+tk+'</div>'}

function vCo(){
var tk='',h='<h2 class="ct">Your companies<small>Tap a company to open it</small></h2>';
h+='<button class="btn alt sm" data-a="go" data-v="acct" style="margin-bottom:10px">⚙ Account &amp; security</button>';
D.companies.forEach(function(c){var k=kpi(c);tk+='<span class="ti"><b>'+esc(c.name)+'</b> <i class="'+(k.net>=0?'pos':'neg')+'">'+(k.net>=0?'▲':'▼')+' '+money(Math.abs(k.net))+'</i><u>'+k.n+' items</u></span>'});
D.companies.forEach(function(c){var k=kpi(c);
h+='<div class="card co" data-a="open" data-id="'+c.id+'" data-lp="5000" data-lpa="codel"><div class="nm">'+esc(c.name)+'</div><div class="kp"><span class="'+(k.net>=0?'pos':'neg')+'">'+(k.net>=0?'▲':'▼')+' '+money(Math.abs(k.net))+'</span> this month · '+k.n+' stock items</div></div>'});
h+='<details class="card"><summary>+ Add a new company</summary><input id="nc" placeholder="Company name"><button class="btn full" data-a="addco">Add company</button></details>';
h+='<h3>Backup</h3><div class="g2"><button class="btn alt" data-a="bak">Save backup file</button><button class="btn alt" data-a="rst">Restore backup</button></div><p class="note">'+(CLOUDMODE?'Data synced to cloud.':'Local mode.')+'</p>';
return h}

function vHome(){
var c=C();
function b(v,t,s){return '<button class="big" data-a="go" data-v="'+v+'">'+t+'<small>'+s+'</small></button>'}

function ledHtml(){return '<input id="lq" placeholder="Search..." value="'+esc(S.lq)+'" autocomplete="off" style="margin-bottom:10px"><div id="lr">'+ledBody()+'</div>'}
function ledSearch(){

var rows=c.led.map(function(r,i){return{r:r,i:i}}).filter(function(x){var r=x.r,txt=((r.note||'')+' '+r.d+' '+dmy(r.d)+' '+(r.inc===''?'':r.inc)+' '+(r.exp===''?'':r.exp)).toLowerCase();return terms.every(function(t){return txt.indexOf(t)>-1})}).sort(function(a,b){return a.r.d<b.r.d?1:a.r.d>b.r.d?-1:b.i-a.i});
var ti=0,te=0,body='';
rows.forEach(function(x){var r=x.r;ti+=num(r.inc);te+=num(r.exp);
body+='<tr><td><input type="date" value="'+esc(r.d)+'" data-f="d" data-k="led" data-id="'+r.id+'"></td><td><input value="'+esc(r.note)+'" placeholder="Where from / spent on" data-f="note" data-k="led" data-id="'+r.id+'"></td><td><input type="number" inputmode="decimal" value="'+esc(r.inc)+'" data-f="inc" data-k="led" data-id="'+r.id+'"></td><td><input type="number" inputmode="decimal" value="'+esc(r.exp)+'" data-f="exp" data-k="led" data-id="'+r.id+'"></td><td><button class="x" data-a="del" data-k="led" data-id="'+r.id+'">'+(S.arm==='led'+r.id?'?':'×')+'</button></td></tr>'});
return '<div class="tiles"><div class="tile"><small>Found</small><b>'+rows.length+' rows</b></div><div class="tile"><small>Income</small><b class="pos">'+money(ti)+'</b></div><div class="tile"><small>Expense</small><b class="neg">'+money(te)+'</b></div></div><div class="sheet"><table style="min-width:560px"><tr><th style="width:140px">Date</th><th>Note</th><th style="width:110px">Income ৳</th><th style="width:110px">Expense ৳</th><th style="width:40px"></th></tr>'+(body||'<tr><td colspan="5" class="r" style="text-align:left">Nothing found.</td></tr>')+'</table></div>'}
function ledBody(){

body+='<tr class="tot"><td colspan="2">'+dmy(d)+' · day total</td><td class="r pos">'+money(g.i)+'</td><td class="r neg">'+money(g.e)+'</td><td class="r">'+money(g.bal)+'</td><td></td></tr>';
g.rows.slice().reverse().forEach(function(x){var r=x.r;
body+='<tr><td><input type="date" value="'+esc(r.d)+'" data-f="d" data-k="led" data-id="'+r.id+'"></td><td><input value="'+esc(r.note)+'" placeholder="Where from / spent on" data-f="note" data-k="led" data-id="'+r.id+'"></td><td><input type="number" inputmode="decimal" value="'+esc(r.inc)+'" data-f="inc" data-k="led" data-id="'+r.id+'"></td><td><input type="number" inputmode="decimal" value="'+esc(r.exp)+'" data-f="exp" data-k="led" data-id="'+r.id+'"></td><td class="r '+(x.bal<0?'neg':'')+'">'+money(x.bal)+'</td><td><button class="x" data-a="del" data-k="led" data-id="'+r.id+'">'+(S.arm==='led'+r.id?'?':'×')+'</button></td></tr>'})});

+'<div class="sheet"><table><tr><th style="width:140px">Date</th><th>Note (from / to)</th><th style="width:110px">Income ৳</th><th style="width:110px">Expense ৳</th><th style="width:120px">Balance</th><th style="width:40px"></th></tr>'
+'<tr class="tot"><td colspan="2">Total '+(f?dmy(f):m)+'</td><td class="r">'+money(ti)+'</td><td class="r">'+money(te)+'</td><td class="r">'+money(open+ti-te)+'</td><td></td></tr>'+body
+'<tr class="tot"><td colspan="4">Opening balance (before '+(f?dmy(f):dmy(start))+')</td><td class="r">'+money(open)+'</td><td></td></tr></table></div>'}

function debtTable(c){
var q=S.dq.trim().toLowerCase(),tp=0,tpd=0,body='';
var a=c.debt.slice().reverse().filter(function(r){return !q||((r.sup||'')+' '+(r.item||'')).toLowerCase().indexOf(q)>-1}).sort(function(x,y){return x.d<y.d?1:x.d>y.d?-1:0});
a.forEach(function(r){tp+=num(r.price);tpd+=num(r.paid);var left=num(r.price)-num(r.paid);
function f(k,t,ph){return '<td><input '+(t?'type="'+t+'" ':'')+(t==='number'?'inputmode="decimal" ':'')+'value="'+esc(r[k])+'" placeholder="'+(ph||'')+'" data-f="'+k+'" data-k="debt" data-id="'+r.id+'"></td>'}

var g={};c.debt.forEach(function(r){var k=(r.sup||'(no name)').trim().toLowerCase();if(!g[k])g[k]={n:(r.sup||'(no name)').trim(),p:0,d:0};g[k].p+=num(r.price);g[k].d+=num(r.paid)});
var gs=Object.keys(g).map(function(k){return g[k]}).filter(function(x){return !q||x.n.toLowerCase().indexOf(q)>-1}),sb='';
gs.forEach(function(x){sb+='<tr><td class="r" style="text-align:left">'+esc(x.n)+'</td><td class="r">'+money(x.p)+'</td><td class="r">'+money(x.d)+'</td><td class="r '+(x.p-x.d>0?'neg':'')+'"><b>'+money(x.p-x.d)+'</b></td></tr>'});
return '<div class="tiles"><div class="tile"><small>Total Purchases</small><b>'+money(tp)+'</b></div><div class="tile"><small>Paid</small><b class="pos">'+money(tpd)+'</b></div><div class="tile"><small>Payable</small><b class="neg">'+money(tp-tpd)+'</b></div></div>'
+'<div class="sheet"><table style="min-width:900px"><tr><th style="width:140px">Date</th><th>Supplier</th><th>Material</th><th style="width:160px">Qty</th><th style="width:110px">Price ৳</th><th style="width:110px">Paid ৳</th><th style="width:120px">Left ৳</th><th style="width:80px">Actions</th></tr>'+(body||'<tr><td colspan="8" class="r" style="text-align:left">No rows yet.</td></tr>')+'</table></div>'}

function vStk(){return '<h2>Stock inventory</h2>'+tabs(['stock:Stock','sell:Sell','total:Total stock'],S.tab,'tab')+(S.tab==='stock'?stockTab():S.tab==='sell'?sellTab():totalTab())}
function lastMv(c,id){for(var i=c.mov.length-1;i>=0;i--)if(c.mov[i].pid===id){var m=c.mov[i];return dmy(m.d)+': '+TYPES[m.type]+' '+(m.delta>0?'+':'−')+Math.abs(m.delta)}return ''}
function stockTab(){var nt=S.sd!==today()?'<p class="note" style="color:var(--accent)">Entering stock for '+dmy(S.sd)+'.</p>':'';return '<div class="card"><label class="note">Stock entry date</label><input type="date" id="sd" value="'+S.sd+'">'+nt+'</div>'
+'<div style="display:flex;gap:8px;margin-bottom:10px;"><input id="q" placeholder="Search or scan product..." value="'+esc(S.q)+'" autocomplete="off" style="flex:1;"><button class="btn" onclick="window.startScanner(\'search\')">📷 Scan</button></div>'
+'<details class="card" style="margin-top:10px"><summary>+ Add new item</summary><div class="g2"><div><label>Item name</label><input id="sn" placeholder="Item name"></div><div><label>Unit</label><input id="su" placeholder="kg, pcs"></div></div><label class="note">Barcode (Optional)</label><div style="display:flex;gap:8px;"><input id="sb" placeholder="Scan or type barcode"><button class="btn alt" onclick="window.startScanner(\'newitem\')">📷</button></div><label class="note">Type</label><select id="sk"><option value="product">Product (counts as production)</option><option value="raw">Raw material</option></select><label class="note">Starting quantity</label><input id="sq0" type="number" inputmode="decimal" placeholder="0"><button class="btn full" data-a="addstk">Add item</button></details>'
+'<div id="sl">'+stkList(C())+'</div>'+stkEntries(C())}
function stkEntries(c){
var a=c.mov.filter(function(m){return m.d===S.sd});
return '<h3>Stock entries on '+dmy(S.sd)+'</h3>'+(a.length?a.map(function(m){var it=item(c,m.pid);return '<div class="item"><div><b>'+esc(it?it.name:m.name)+'</b><br><small>'+TYPES[m.type]+(m.note?' · '+esc(m.note):'')+'</small></div><div style="text-align:right"><b class="'+(m.delta>0?'pos':'neg')+'">'+(m.delta>0?'+':'−')+Math.abs(m.delta)+' '+esc(m.unit)+'</b>'+(m.type==='sale'?'':'<br><button class="btn alt sm" data-a="delmv" data-id="'+m.id+'">'+(S.arm==='mv'+m.id?'Tap again to delete':'Delete entry')+'</button>')+'</div></div>'}).join(''):'<p class="note">No stock entries on this date.</p>')}
function stkList(c){
var q=S.q.trim().toLowerCase(),a=c.stk.filter(function(i){return !q||i.name.toLowerCase().indexOf(q)>-1 || (i.barcode && String(i.barcode)===q)});
if(!a.length)return '<p class="note">'+(c.stk.length?'No product matches.':'No items yet.')+'</p>';
return a.map(function(i){return '<div class="card"><div class="top"><input class="nm" value="'+esc(i.name)+'" data-f="name" data-k="stk" data-id="'+i.id+'"><span class="q">'+esc(num(i.qty))+' '+esc(i.unit)+'</span></div><div class="g3" style="margin-top:6px"><div><label>Unit</label><input value="'+esc(i.unit)+'" data-f="unit" data-k="stk" data-id="'+i.id+'"></div><div><label>Type</label><select data-f="kind" data-k="stk" data-id="'+i.id+'"><option value="product"'+(i.kind==='raw'?'':' selected')+'>Product</option><option value="raw"'+(i.kind==='raw'?' selected':'')+'>Raw</option></select></div><div><label>Barcode</label><input value="'+esc(i.barcode||'')+'" data-f="barcode" data-k="stk" data-id="'+i.id+'"></div></div><div class="adj"><input type="number" inputmode="decimal" id="adj-'+i.id+'" placeholder="Amount"><button class="btn" data-a="in" data-id="'+i.id+'">+ In</button><button class="btn alt" data-a="out" data-id="'+i.id+'">− Out</button></div><div class="top" style="margin-top:6px"><small class="note">'+esc(lastMv(c,i.id))+'</small><button class="btn alt sm" data-a="del" data-k="stk" data-id="'+i.id+'">'+armLbl('stk'+i.id)+'</button></div></div>'}).join('')}

function sellRes(c){
var q=S.sq.trim().toLowerCase(),a=c.stk.filter(function(i){return !q||i.name.toLowerCase().indexOf(q)>-1 || (i.barcode && String(i.barcode)===q)}).slice(0,8);
if(!c.stk.length)return '<p class="note">Add products first.</p>';
return a.length?a.map(function(i){return '<button class="chip" data-a="addline" data-id="'+i.id+'">'+esc(i.name)+'<small>'+esc(num(i.qty))+' '+esc(i.unit)+'</small></button>'}).join(''):'<p class="note">No matches.</p>'}
function sellTab(){
var c=C(),h='<div style="display:flex;gap:8px;margin-bottom:10px;"><input id="sq" placeholder="Search or scan to sell..." value="'+esc(S.sq)+'" autocomplete="off" style="flex:1;"><button class="btn" onclick="window.startScanner(\'sell\')">📷 Scan</button></div><div id="sr">'+sellRes(c)+'</div><h3>New invoice</h3><div class="card" id="cartbox">'+cartHtml(c)+'</div><h3>Recent invoices</h3>';
if(!c.sal.length)h+='<p class="note">No invoices yet.</p>';
c.sal.slice(0,20).forEach(function(s){var t=saleTotal(s),d=t-s.paid;h+='<div class="item" data-a="openinv" data-id="'+s.id+'"><div><b>'+esc(s.no)+' · '+esc(s.cust||'Walk-in')+'</b><br><small>'+esc(dmy(s.d))+'</small></div><div style="text-align:right"><b>'+money(t)+'</b><br>'+(d>0?'<span class="due">Due '+money(d)+'</span>':'<small>Paid</small>')+'</div></div>'});
return h}
function cartHtml(c){
var k=S.cart,h='<div class="g2"><div><label>Date</label><input type="date" data-c="d" value="'+esc(k.d)+'"></div><div><label>Customer</label><input data-c="cust" value="'+esc(k.cust)+'" placeholder="Walk-in"></div></div><label class="note">Phone</label><input data-c="phone" inputmode="tel" value="'+esc(k.phone)+'">';
if(!k.lines.length)h+='<p class="note">Add items above.</p>';
k.lines.forEach(function(l,i){var it=item(c,l.pid);if(!it)return;
h+='<div class="ln"><b>'+esc(it.name)+'</b><div class="g3"><div><label>Qty</label><input type="number" inputmode="decimal" data-c="lq" data-i="'+i+'" value="'+esc(l.qty)+'"></div><div><label>Price ৳</label><input type="number" inputmode="decimal" data-c="lp" data-i="'+i+'" value="'+esc(l.price)+'"></div><div class="lt" id="lt'+i+'">'+money(num(l.qty)*num(l.price))+'</div></div><button class="x" data-a="rmline" data-i="'+i+'">×</button></div>'});
return h+'<div class="tot"><span>Total</span><span id="ct">'+money(cartTotal())+'</span></div><label class="note">Received (৳)</label><input type="number" inputmode="decimal" data-c="paid" value="'+esc(k.paid)+'" placeholder="0"><div class="tot"><span>Due</span><span id="cdue">'+money(cartTotal()-num(k.paid))+'</span></div><button class="btn full" data-a="savesale">Save &amp; make invoice</button>'}
function cartTotal(){return S.cart.lines.reduce(function(a,l){return a+num(l.qty)*num(l.price)},0)}
function cartSet(t){
var k=S.cart,f=t.dataset.c;
if(f==='lq'||f==='lp'){var l=k.lines[+t.dataset.i];if(!l)return;l[f==='lq'?'qty':'price']=t.value;var e=$('lt'+t.dataset.i);if(e)e.textContent=money(num(l.qty)*num(l.price))}
else k[f]=t.value;
$('ct').textContent=money(cartTotal());$('cdue').textContent=money(cartTotal()-num(k.paid))}

function unitKey(u){var k=String(u||'').trim().toLowerCase().replace(/\s+/g,' ');if(k.length>2&&k.charAt(k.length-1)==='s'&&k.slice(-2)!=='ss')k=k.slice(0,-1);return k||'units'}
function isAdd(m){return m.type==='in'||m.type==='open'||(m.type==='set'&&m.delta>0)}
function legacy(c,it){var s=0;c.mov.forEach(function(m){if(m.pid===it.id)s+=m.delta});var b=num(it.qty)-s;return b>0.000001?Math.round(b*1e6)/1e6:0}
function soldOut(c,it){return c.mov.reduce(function(s,m){return s+(m.pid===it.id&&(m.type==='sale'||m.type==='out')?-m.delta:0)},0)}
function prod(c,it,fn){return c.mov.reduce(function(s,m){return s+(m.pid===it.id&&isAdd(m)&&fn(m.d)?m.delta:0)},0)}
function regFor(c,items){
var ids={},base=0,days={};
items.forEach(function(it){ids[it.id]=1;base+=legacy(c,it)});
c.mov.forEach(function(m){if(!ids[m.pid])return;var o=days[m.d]||(days[m.d]={p:0,s:0});if(isAdd(m))o.p+=m.delta;else if(m.delta<0)o.s-=m.delta});
return{base:base,days:days}}
function regAt(r,D){
var o=r.base,p=0,s=0;
Object.keys(r.days).forEach(function(k){var x=r.days[k];if(k<D)o+=x.p-x.s;else if(k===D){p=x.p;s=x.s}});
return{o:o,p:p,s:s,tot:o+p,end:o+p-s}}
function regMonth(r,D){var m=0;Object.keys(r.days).forEach(function(k){if(k.slice(0,7)===D.slice(0,7))m+=r.days[k].p});return m}
function totalTab(){
var c=C(),d=S.td,t=today();
if(!c.stk.length)return '<h3>Total stock</h3><p class="note">No stock yet.</p>';
var U={};
c.stk.forEach(function(i){var u=unitKey(i.unit),o=U[u]||(U[u]={prod:[],all:[]});o.all.push(i);if(i.kind!=='raw')o.prod.push(i)});
var us=Object.keys(U),R={};
us.forEach(function(u){var rg=regFor(c,U[u].prod),r=regAt(rg,d),stock=0;U[u].all.forEach(function(i){stock+=qtyAt(c,i,d)});R[u]={day:r.p,mon:regMonth(rg,d),stock:stock,all:r.tot,o:r.o,s:r.s}});
function blk(title,key,cls,sub){return '<div class="card"><small class="note" style="text-transform:uppercase;font-weight:600">'+title+'</small><div class="q '+cls+'">'+us.map(function(u){return R[u][key]+' '+esc(u)}).join(' · ')+'</div>'+(sub?'<small class="note">'+us.map(function(u){return sub(R[u],u)}).join(' · ')+'</small>':'')+'</div>'}
var now=d===t;
var h='<label class="note">Date</label><input type="date" id="td" value="'+d+'" style="margin-bottom:10px">';
h+=blk((now?'Today\'s production':'Production on')+' ('+dmy(d)+')','day','pos')
+blk('In stock total'+(now?'':' (end of '+dmy(d)+')'),'stock','',function(r,u){return 'Total '+r.all+' − sold/out '+r.s+(r.stock!==r.all-r.s?' (raw materials included)':'')})
+blk('Total production this month ('+d.slice(0,7)+')','mon','pos')
+blk('Total production '+(now?'till today':'till '+dmy(d)),'all','pos',function(r,u){return 'Opening stock '+r.o+' + produced '+r.day});
