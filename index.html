<style>
:root{--bg:#eceff1;--surface:#fff;--ink:#14171a;--mute:#5a636b;--line:#cfd5da;--accent:#f5b800;--dark:#14171a;--field:#fff;--red:#c62f26;--green:#1f8a4c;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101214;--surface:#1a1e22;--ink:#f2f4f5;--mute:#9aa4ad;--line:#2c3238;--dark:#0b0c0e;--field:#12151a;--red:#ff6b61;--green:#4cd185}}
:root[data-theme="dark"]{--bg:#101214;--surface:#1a1e22;--ink:#f2f4f5;--mute:#9aa4ad;--line:#2c3238;--dark:#0b0c0e;--field:#12151a;--red:#ff6b61;--green:#4cd185}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,Arial,sans-serif;line-height:1.45}
h1,h2,h3,.logo{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:10;background:var(--dark);color:#f2f4f5;border-bottom:4px solid var(--accent)}
header .wrap{display:flex;align-items:center;gap:10px;height:56px}
#bk{background:none;border:2px solid var(--accent);color:var(--accent);font:700 1rem "Barlow Condensed",Arial,sans-serif;padding:4px 10px;cursor:pointer;text-transform:uppercase}
#tt{font:800 1.35rem "Barlow Condensed",Arial,sans-serif;text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding-top:16px;padding-bottom:70px}
h2{font-size:1.8rem;margin-bottom:10px}h3{font-size:1.1rem;margin:18px 0 8px;color:var(--mute)}
input,select{width:100%;padding:10px;font:inherit;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:0}
input:focus,select:focus{outline:2px solid var(--accent)}
.btn{display:inline-block;background:var(--accent);color:#14171a;font:700 1rem "Barlow Condensed",Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em;padding:10px 16px;border:0;cursor:pointer}

.co .btns{display:flex;gap:8px;margin-top:8px}.co .btns .btn{flex:1}

.pos{color:var(--green)}.neg{color:var(--red)}

td.r{text-align:right;padding:8px 6px;white-space:nowrap}
tr.tot td{font-weight:800;background:var(--bg);padding:8px 6px}
.x{background:none;border:0;color:var(--red);font-size:1.2rem;cursor:pointer;padding:6px 8px}
.tabs{display:flex;margin-bottom:12px}

.tab.on{background:var(--dark);color:var(--accent)}
.tabs .tab{padding:10px 4px;font-size:.95rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g2 label,.f label{display:block;font-size:.75rem;font-weight:600;color:var(--mute)}
.adj{display:flex;gap:6px;margin-top:8px}.adj input{flex:1}
.q{font:800 1.6rem "Barlow Condensed",Arial,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}

body.co{--bg:#0b0e11;--surface:rgba(18,24,30,.84);--ink:#f2f4f5;--mute:#9aa4ad;--line:#2c3238;--field:#12151a;--red:#ff6b61;--green:#4cd185}

main{position:relative;z-index:1}
[data-lp]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;cursor:pointer}

.lt{font-weight:800;text-align:right;padding-bottom:10px}

.dlg p{margin:0;font-size:1.1rem}

#fmrcpt .rh{border-bottom:3px solid #f5b800;padding-bottom:8px;margin-bottom:8px}

@media print{body *{visibility:hidden}#rcpt,#rcpt *,#fmrcpt,#fmrcpt *{visibility:visible}#rcpt,#fmrcpt{position:absolute;left:0;top:0;width:100%;border:0}}
#tick{margin:0}body.co .tab.on{background:var(--accent);color:#14171a;border-color:var(--accent)}#cv{opacity:.28}body.front #cv{opacity:1}body.co .btn.alt{border-color:#39414a}

body.co{color-scheme:dark;--line:#3d4852}
body.co input,body.co select,body.co textarea{background:transparent;border:1.5px solid #8793a0;color:#f2f4f5}
body.co input::placeholder{color:#a3adb6;opacity:1}

body.co td input,body.co td select{border:1px solid #6b7782;margin:2px;width:calc(100% - 4px);padding:8px 6px}
body.co option{background:#1a1e22;color:#f2f4f5}

.st{font-size:.8rem;font-weight:600;margin-left:auto;white-space:nowrap}.st.on{color:var(--green)}.st.off{color:#f5b800}
#gate,#lock{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
#gate{z-index:80;background:rgba(8,10,12,.96)}
#lock{z-index:100;background:#0b0e11}
.gc,.lkc{background:#141a20;border:1px solid #46515c;border-left:6px solid var(--accent);padding:20px;max-width:400px;width:100%;color:#f2f4f5;margin:auto}
.gc h2,.lkc h2{margin-bottom:10px}.gc p{margin:8px 0}
.lkl{margin-bottom:8px}
.gerr{color:#ff6b61;font-weight:600}
.gm{margin:10px 0;display:grid;gap:8px}.gm label{display:flex;gap:8px;align-items:center;font-size:.9rem;color:#f2f4f5}
input[type=radio]{width:auto !important;margin:0}
.dots{font-size:1.6rem;letter-spacing:.3em;text-align:center;margin:8px 0;min-height:2rem}
.lkm{color:#ff6b61;text-align:center;min-height:1.4rem;font-size:.9rem}
.kp3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.kp3 button{height:56px;font:700 1.4rem "Barlow Condensed",Arial,sans-serif;background:transparent;color:#f2f4f5;border:1.5px solid #8793a0;cursor:pointer}
.lkf{display:block;margin:14px auto 0;background:none;border:0;color:#9aa4ad;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<header><div class="wrap"><svg id="lg" width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#f5b800"/><rect x="12" y="34" width="10" height="18" rx="3" fill="#14171a"/><rect x="27" y="24" width="10" height="28" rx="3" fill="#14171a"/><rect x="42" y="13" width="10" height="39" rx="3" fill="#14171a"/></svg><button id="bk" hidden>&larr; Back</button><div id="tt">Factory Manager</div><span id="st" class="st"></span></div></header>
<div class="tick" id="tick"></div>

<main class="wrap" id="app"></main>
<div id="dlg"></div>
<div id="gate"></div>
<div id="lock"></div>
<input type="file" id="rf" accept=".json,application/json" hidden>
<script src="firebase-config.js"></script>
<script>
(function(){
function $(i){return document.getElementById(i)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
/* CHANGED: added c.rcpt=c.rcpt||[] */
function supKey(n){return String(n==null?'':n).normalize('NFC').replace(/[\u200B-\u200D\uFEFF\u00A0\s]+/g,'').toLowerCase()}
function supClean(n){return String(n==null?'':n).normalize('NFC').replace(/[\u200B\uFEFF]/g,'').replace(/\s+/g,' ').trim()}
function dTot(r){var q=num(r.qty),u=num(r.rate);return(q&&u)?Math.round(q*u*100)/100:num(r.price)}
function fix(c){c.led=c.led||[];c.debt=c.debt||[];c.debt.forEach(function(r){if((r.rate===undefined||r.rate==='')&&num(r.qty)>0&&num(r.price)>0)r.rate=num(r.price)/num(r.qty);if(r.rate===undefined)r.rate=''});c.stk=c.stk||[];c.sal=c.sal||[];c.mov=c.mov||[];c.wrk=c.wrk||[];c.att=c.att||{};c.adv=c.adv||[];c.invNo=c.invNo||1;c.rcpt=c.rcpt||[];c.due=c.due||[];return c}
function blank(n){return fix({id:uid(),name:n,ts:Date.now()})}
function load(){try{var v=localStorage.getItem('fm_data');return v?JSON.parse(v):null}catch(e){return null}}
var CFG=window.FM_CONFIG||(typeof firebaseConfig!=='undefined'?firebaseConfig:null);
var CLOUDMODE=!!(CFG&&CFG.apiKey&&String(CFG.apiKey).indexOf('PASTE')<0&&CFG.projectId&&String(CFG.projectId).indexOf('PASTE')<0);
var D=load(),LOCALSAVED=null;
if(CLOUDMODE){LOCALSAVED=(D&&D.companies&&D.companies.length)?D:null;D={companies:[]}}
else if(!D||!D.companies||!D.companies.length)D={companies:[blank('MS Recycle Plant'),blank('Brothers Recycle')]};
D.companies.forEach(fix);
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function save(){if(CLOUDMODE){cloudDirty();return}try{localStorage.setItem('fm_data',JSON.stringify(D))}catch(e){toast('Could not save on this phone')}}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return '৳ '+(Math.round(n*100)/100).toLocaleString('en-US')}
function dmy(d){var p=String(d).split('-');return p.length==3?p[2]+'-'+p[1]+'-'+p[0]:d}
function bn2en(t){return String(t==null?'':t).replace(/[\u09E6-\u09EF]/g,function(c){return c.charCodeAt(0)-0x09E6}).replace(/[\u0660-\u0669]/g,function(c){return c.charCodeAt(0)-0x0660}).replace(/[\u06F0-\u06F9]/g,function(c){return c.charCodeAt(0)-0x06F0}).replace(/[\u0964\u066B\u060C]/g,'.').replace(/,/g,'')}
function num(v){return parseFloat(bn2en(v))||0}
function numFix(r){(r.querySelectorAll?r.querySelectorAll('input[type=number]'):[]).forEach(function(i){i.type='text';i.setAttribute('inputmode','decimal');i.setAttribute('autocomplete','off');i.dataset.n='1'})}
document.addEventListener('input',function(e){var t=e.target;if(t&&t.dataset&&t.dataset.n==='1'){var v=bn2en(t.value);if(v!==t.value){t.value=v;try{t.setSelectionRange(v.length,v.length)}catch(x){}}}},true);
if(window.MutationObserver){new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType===1)numFix(n)})})}).observe(document.documentElement,{childList:true,subtree:true})}
numFix(document);

/* ---- smart suggestions: reuse words already typed anywhere in the data ---- */
function sugCollect(key){
var seen={},order=0,out=[];
function add(v){if(typeof v!=='string')return;v=supClean(v);if(!v||v.length>120||/^[\d.,\s\-\/+*]+$/.test(v))return;var k=supKey(v),e=seen[k];if(!e){e=seen[k]={v:v,n:0,o:0};out.push(e)}e.n++;e.o=++order;e.v=v}
(D.companies||[]).forEach(function(c){
if(key==='cust'){(c.sal||[]).forEach(function(r){add(r.cust)});(c.rcpt||[]).forEach(function(r){add(r.cust)})}
else if(key==='pn'){(c.debt||[]).forEach(function(r){add(r.item)});(c.stk||[]).forEach(function(r){add(r.name)})}
else if(key==='rcpt:desc'){(c.rcpt||[]).forEach(function(r){(r.items||[]).forEach(function(i){add(i.desc)})})}
else{var m=key.split(':');(c[m[0]]||[]).forEach(function(r){if(r&&typeof r==='object')add(r[m[1]])})}});
out.sort(function(a,b){return b.n-a.n||b.o-a.o});
return out.slice(0,300).map(function(e){return e.v})}
function sugKeyOf(el){
if(!el||el.tagName!=='INPUT'||el.readOnly||el.disabled)return '';
var ty=(el.getAttribute('type')||'text').toLowerCase();if(ty!=='text')return '';
var im=(el.getAttribute('inputmode')||'').toLowerCase();if(im==='decimal'||im==='tel'||im==='numeric')return '';
if(el.hasAttribute('data-n'))return '';
var d=el.dataset||{},id=el.id||'';
if(d.k&&d.f){if(d.f==='d'||d.f==='kind')return '';return d.k+':'+d.f}
if(d.r){if(d.r==='no'||d.r==='phone')return '';return d.r==='cust'?'cust':d.r==='desc'?'rcpt:desc':'rcpt:'+d.r}
if(d.c==='cust')return 'cust';
if(id==='sn')return 'stk:name';if(id==='su')return 'stk:unit';if(id==='pn')return 'pn';
return ''}
document.addEventListener('focusin',function(e){
var el=e.target,key=sugKeyOf(el);if(!key)return;
var dl='sg_'+key.replace(/[^a-z]/gi,'_'),box=document.getElementById(dl);
if(!box){box=document.createElement('datalist');box.id=dl;document.body.appendChild(box)}
var list=sugCollect(key),h='';for(var i=0;i<list.length;i++)h+='<option value="'+esc(list[i])+'">';
box.innerHTML=h;el.setAttribute('list',dl);el.setAttribute('autocomplete','off')});
function pad(n){return ('0000'+n).slice(-4)}
function daysIn(m){return new Date(+m.slice(0,4),+m.slice(5,7),0).getDate()}
function newCart(){return{d:today(),cust:'',phone:'',paid:'',lines:[]}}
/* CHANGED: added rtab, rid */
var S={v:'co',cid:null,atab:'inc',tab:'stock',wtab:'info',month:today().slice(0,7),date:today(),rd:today(),td:today(),sd:today(),ld:'',lq:'',wsq:'',wid:'',wm:today().slice(0,7),arm:'',q:'',sq:'',dq:'',mv:'',dlg:'',inv:'',cart:newCart(),rtab:'list',rid:'',slq:'',wslid:'',wsld:today(),sdid:'',lot:'',serq:'',bim:today().slice(0,7),bisal:1};
function C(){return D.companies.filter(function(c){return c.id===S.cid})[0]}
function armLbl(k){return S.arm===k?'Tap again to delete':'Delete'}
function item(c,id){return c.stk.filter(function(x){return x.id===id})[0]}
function mvAdj(c,it,delta,type,note,d,x){it.qty=num(it.qty)+delta;var m={id:uid(),d:d||today(),pid:it.id,name:it.name,unit:it.unit,delta:delta,type:type,note:note||''};if(x)Object.keys(x).forEach(function(k){m[k]=x[k]});c.mov.push(m)}

/* ---- raw material purchase price (v31) ---- */

/* ---------- animated front screen ---------- */
var cv=$('cv'),cx=cv.getContext('2d'),raf=0,cands=[],off=0,lt=0,N=44,mql=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)');
function gen(){var p=cands.length?cands[cands.length-1].c:100,c=p+(Math.random()-.47)*5;return{o:p,c:c,h:Math.max(p,c)+Math.random()*2.5,l:Math.min(p,c)-Math.random()*2.5}}
for(var i0=0;i0<N+2;i0++)cands.push(gen());
function draw(){
var dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;
if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
var mn=1e9,mx=-1e9;cands.forEach(function(k){mn=Math.min(mn,k.l);mx=Math.max(mx,k.h)});
var top=H*.14,bot=H*.9,cw=W/N;
function y(v){return bot-(v-mn)/(mx-mn||1)*(bot-top)}
cx.strokeStyle='rgba(255,255,255,.06)';cx.lineWidth=1;
for(var g=1;g<6;g++){var gy=H*g/6;cx.beginPath();cx.moveTo(0,gy);cx.lineTo(W,gy);cx.stroke()}
cands.forEach(function(k,i){var x=i*cw-off+cw/2,up=k.c>=k.o;
cx.strokeStyle=cx.fillStyle=up?'rgba(76,209,133,.5)':'rgba(255,107,97,.5)';
cx.beginPath();cx.moveTo(x,y(k.h));cx.lineTo(x,y(k.l));cx.stroke();
var yo=y(k.o),yc=y(k.c);cx.fillRect(x-cw*.28,Math.min(yo,yc),cw*.56,Math.max(2,Math.abs(yo-yc)))});
cx.strokeStyle='rgba(245,184,0,.8)';cx.lineWidth=2;cx.beginPath();
cands.forEach(function(k,i){var s=0,n=0;for(var j=Math.max(0,i-7);j<=i;j++){s+=cands[j].c;n++}var x=i*cw-off+cw/2,yy=y(s/n);if(i)cx.lineTo(x,yy);else cx.moveTo(x,yy)});
cx.stroke();}
function loop(ts){
var dt=lt?Math.min(ts-lt,60):16;lt=ts;var cw=innerWidth/N;off+=dt*cw/900;
if(off>=cw){off-=cw;cands.shift();cands.push(gen())}
draw();raf=requestAnimationFrame(loop)}
function anim(){if(mql&&mql.matches){draw();return}if(!raf){lt=0;raf=requestAnimationFrame(loop)}}
window.addEventListener('resize',function(){draw()});

function stockTab(isRaw){var nt=S.sd!==today()?'<p class="note" style="color:var(--accent)">Entering '+(isRaw?'raw material':'stock')+' for '+dmy(S.sd)+'. Set the date back to today for today’s entries.</p>':'';

function stkEntries(c,isRaw){
var a=c.mov.filter(function(m){if(m.d!==S.sd)return false;var it=item(c,m.pid),r=it?it.kind==='raw':m.kd==='raw';return isRaw?r:!r}),top='';
if(isRaw){var ds=rawSum(rawBuys(c,S.sd,S.sd)),m0=S.sd.slice(0,7),ms=rawSum(rawBuys(c,m0+'-01',mEnd(m0)));
top='<h3>Raw material total on '+dmy(S.sd)+'</h3><div class="tiles"><div class="tile"><small>Bought on this date</small><b>'+unitsTxt(ds.qty)+'</b></div><div class="tile"><small>Cost on this date</small><b>'+money(ds.cost)+'</b></div><div class="tile"><small>Month '+m0+' cost</small><b>'+money(ms.cost)+'</b></div></div>'+(ds.noRate?'<p class="note neg">'+ds.noRate+' entr'+(ds.noRate>1?'ies have':'y has')+' no price. Type the price per unit on the entry below.</p>':'')}
return top+'<h3>'+(isRaw?'Raw material entries':'Stock entries')+' on '+dmy(S.sd)+'</h3>'+(a.length?a.map(function(m){var it=item(c,m.pid),rb=isRaw&&isRawBuy(c,m);return '<div class="item"><div><b>'+esc(it?it.name:m.name)+'</b><br><small>'+TYPES[m.type]+(m.ser?' · Serial '+esc(m.ser)+(m.bn?' / batch '+esc(m.bn):''):'')+(m.note?' · '+esc(m.note):'')+'</small>'+(rb?'<br><label class="note">Price per unit ৳</label><input type="text" inputmode="decimal" data-n="1" data-f="rate" data-k="mov" data-id="'+m.id+'" value="'+esc(num(m.rate)>0?num(m.rate):'')+'" placeholder="0" style="width:120px;padding:6px">':'')+'</div><div style="text-align:right"><b class="'+(m.delta>0?'pos':'neg')+'">'+(m.delta>0?'+':'−')+Math.abs(m.delta)+' '+esc(m.unit)+'</b>'+(rb?'<br><b>'+(num(m.rate)>0?money(num(m.delta)*num(m.rate)):'no price')+'</b>':'')+(m.type==='sale'?'':'<br><button class="btn alt sm" data-a="delmv" data-id="'+m.id+'">'+(S.arm==='mv'+m.id?'Tap again to delete':'Delete entry')+'</button>')+'</div></div>'}).join(''):'<p class="note">No '+(isRaw?'raw material':'stock')+' entries on this date.</p>')}
function stkReportHtml(c,i){
var totProd=legacy(c,i),totSold=0,prodRows=[],sellRows=[];
c.mov.slice().sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0}).forEach(function(m){
if(m.pid!==i.id)return;
if(isAdd(m)){
totProd+=num(m.delta);
prodRows.push('<tr><td class="r" style="text-align:left">'+esc(dmy(m.d))+'</td><td class="r pos">+'+fqn(m.delta)+' '+esc(i.unit)+'</td><td class="r" style="text-align:left">'+(m.ser?'Serial '+esc(m.ser):esc(TYPES[m.type]||''))+(i.kind==='raw'&&num(m.rate)>0?' · ৳'+fqn(m.rate)+'/'+esc(i.unit)+' = '+money(num(m.delta)*num(m.rate)):'')+'</td></tr>');
}else if(m.delta<0){
var q=Math.abs(num(m.delta));
totSold+=q;
var ref=m.type==='sale'?'Sold ('+esc(m.note||'Invoice')+')':esc(TYPES[m.type]||'Out');
sellRows.push('<tr><td class="r" style="text-align:left">'+esc(dmy(m.d))+'</td><td class="r neg">−'+fqn(q)+' '+esc(i.unit)+'</td><td class="r" style="text-align:left">'+ref+'</td></tr>');
}
});
if(legacy(c,i)>0)prodRows.push('<tr><td class="r" style="text-align:left">Opening / Earlier</td><td class="r pos">+'+fqn(legacy(c,i))+' '+esc(i.unit)+'</td><td class="r" style="text-align:left">Initial stock</td></tr>');
var h='<div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)">';
h+='<div class="tiles" style="grid-template-columns:repeat(3,1fr);margin:6px 0">';
h+='<div class="tile"><small>Total '+(i.kind==='raw'?'In':'Produced')+'</small><b class="pos">'+fqn(totProd)+' '+esc(i.unit)+'</b></div>';
h+='<div class="tile"><small>Total '+(i.kind==='raw'?'Used / Out':'Sold / Out')+'</small><b class="neg">'+fqn(totSold)+' '+esc(i.unit)+'</b></div>';
h+='<div class="tile"><small>Current Stock</small><b>'+fqn(num(i.qty))+' '+esc(i.unit)+'</b></div>';
h+='</div>';
h+='<details style="margin-top:6px" open><summary style="font-size:.9rem;color:var(--accent);cursor:pointer;font-weight:700">▶ Date-wise Production &amp; Sales History</summary>';
h+='<div style="margin-top:6px"><small class="note"><b>'+(i.kind==='raw'?'Stock In History':'Production History')+':</b></small>';
h+=prodRows.length?'<div class="sheet" style="margin:4px 0 8px"><table style="min-width:100%"><tr><th>Date</th><th class="r">Qty</th><th>Details</th></tr>'+prodRows.join('')+'</table></div>':'<p class="note">No production entries yet.</p>';
h+='<small class="note"><b>'+(i.kind==='raw'?'Stock Out History':'Sales / Out History')+':</b></small>';
h+=sellRows.length?'<div class="sheet" style="margin:4px 0"><table style="min-width:100%"><tr><th>Date</th><th class="r">Qty</th><th>Reference</th></tr>'+sellRows.join('')+'</table></div>':'<p class="note">No sales or stock-out entries yet.</p>';
h+='</div></details></div>';
return h;
}

var q=S.q.trim().toLowerCase(),allKind=c.stk.filter(function(i){return isRaw?i.kind==='raw':i.kind!=='raw'}),a=allKind.filter(function(i){return !q||i.name.toLowerCase().indexOf(q)>-1});
if(!a.length)return '<p class="note">'+(allKind.length?(isRaw?'No raw material matches.':'No product matches.'):(isRaw?'No raw materials yet. Add your first raw material above.':'No products yet. Add your first product above.'))+'</p>';
return a.map(function(i){return '<div class="card"><div class="top"><input class="nm" value="'+esc(i.name)+'" data-f="name" data-k="stk" data-id="'+i.id+'"><span class="q">'+esc(num(i.qty))+' '+esc(i.unit)+'</span></div><div class="g3" style="margin-top:6px"><div><label>Unit</label><input value="'+esc(i.unit)+'" data-f="unit" data-k="stk" data-id="'+i.id+'"></div><div><label>Type</label><select data-f="kind" data-k="stk" data-id="'+i.id+'"><option value="product"'+(i.kind==='raw'?'':' selected')+'>Product</option><option value="raw"'+(i.kind==='raw'?' selected':'')+'>Raw material</option></select></div><div><label>Set quantity</label><input type="number" inputmode="decimal" value="'+esc(i.qty)+'" data-f="qty" data-k="stk" data-id="'+i.id+'"></div></div>'+serBox(c,i)+(i.kind==='raw'?rateBox(c,i):'')+'<div class="adj"><input type="number" inputmode="decimal" id="adj-'+i.id+'" placeholder="Amount"><button class="btn" data-a="in" data-id="'+i.id+'">'+(i.kind==='raw'?'+ In':'+ Produced')+'</button><button class="btn alt" data-a="out" data-id="'+i.id+'">− Out</button></div><div class="top" style="margin-top:6px"><small class="note">'+esc(lastMv(c,i.id))+'</small>'+(i.kind==='raw'?'':'<button class="btn sm" data-a="serd" data-id="'+i.id+'">By serial</button>')+'<button class="btn alt sm" data-a="del" data-k="stk" data-id="'+i.id+'">'+armLbl('stk'+i.id)+'</button></div>'+(q?stkReportHtml(c,i):'')+'</div>'}).join('')}

function cartHtml(c){

function cartTotal(){return S.cart.lines.reduce(function(a,l){return a+num(l.qty)*num(l.price)},0)}
function cartSet(t){

else k[f]=t.value;
$('ct').textContent=money(cartTotal());$('cdue').textContent=money(cartTotal()-num(k.paid))}

function unitKey(u){var k=String(u||'').trim().toLowerCase().replace(/\s+/g,' ');if(k.length>2&&k.charAt(k.length-1)==='s'&&k.slice(-2)!=='ss')k=k.slice(0,-1);return k||'units'}
function isAdd(m){return m.type==='in'||m.type==='open'||(m.type==='set'&&m.delta>0)}
function legacy(c,it){var s=0;c.mov.forEach(function(m){if(m.pid===it.id)s+=m.delta});var b=num(it.qty)-s;return b>0.000001?Math.round(b*1e6)/1e6:0}
function soldOut(c,it){return c.mov.reduce(function(s,m){return s+(m.pid===it.id&&(m.type==='sale'||m.type==='out')?-m.delta:0)},0)}
function prod(c,it,fn){return c.mov.reduce(function(s,m){return s+(m.pid===it.id&&isAdd(m)&&fn(m.d)?m.delta:0)},0)}
function regFor(c,items){
var ids={},base=0,days={};
items.forEach(function(it){ids[it.id]=1;base+=legacy(c,it)});
c.mov.forEach(function(m){if(!ids[m.pid])return;var o=days[m.d]||(days[m.d]={p:0,s:0});if(isAdd(m))o.p+=m.delta;else if(m.delta<0)o.s-=m.delta});
return{base:base,days:days}}
function regAt(r,D){
var o=r.base,p=0,s=0;
Object.keys(r.days).forEach(function(k){var x=r.days[k];if(k<D)o+=x.p-x.s;else if(k===D){p=x.p;s=x.s}});
return{o:o,p:p,s:s,tot:o+p,end:o+p-s}}
function regMonth(r,D){var m=0;Object.keys(r.days).forEach(function(k){if(k.slice(0,7)===D.slice(0,7))m+=r.days[k].p});return m}
function totalTab(){
var c=C(),d=S.td,t=today();
if(!c.stk.length)return '<h3>Total stock</h3><p class="note">No stock yet. Add items in the Stock tab.</p>';
var U={};
c.stk.forEach(function(i){var u=unitKey(i.unit),o=U[u]||(U[u]={prod:[],all:[]});o.all.push(i);if(i.kind!=='raw')o.prod.push(i)});
var us=Object.keys(U),R={};
us.forEach(function(u){var rg=regFor(c,U[u].prod),r=regAt(rg,d),stock=0;U[u].all.forEach(function(i){stock+=qtyAt(c,i,d)});R[u]={day:r.p,mon:regMonth(rg,d),stock:stock,all:r.tot,o:r.o,s:r.s}});
function blk(title,key,cls,sub){return '<div class="card"><small class="note" style="text-transform:uppercase;font-weight:600">'+title+'</small><div class="q '+cls+'">'+us.map(function(u){return R[u][key]+' '+esc(u)}).join(' · ')+'</div>'+(sub?'<small class="note">'+us.map(function(u){return sub(R[u],u)}).join(' · ')+'</small>':'')+'</div>'}
var now=d===t;
var h='<label class="note">Production date (starts on today)</label><input type="date" id="td" value="'+d+'" style="margin-bottom:10px">';
h+=blk((now?'1. Today’s production':'1. Production on')+' ('+dmy(d)+')','day','pos')
+blk('2. In stock total'+(now?'':' (end of '+dmy(d)+')'),'stock','',function(r,u){return 'Total '+r.all+' − sold/out '+r.s+(r.stock!==r.all-r.s?' (raw materials included)':'')})
+blk('3. Total production of this month ('+d.slice(0,7)+')','mon','pos')
+blk('4. Total production '+(now?'till today':'till '+dmy(d))+' by factory','all','pos',function(r,u){return 'Opening stock '+r.o+' + produced '+r.day});
h+='<h3>By item</h3><div class="sheet"><table style="min-width:900px"><tr><th>Item</th><th>Unit</th><th>Opening stock</th><th>Produced '+dmy(d)+'</th><th>Total till '+(now?'today':dmy(d))+' by factory</th><th>Sold / out</th><th>In stock</th><th>Produced '+d.slice(0,7)+'</th></tr>';
c.stk.forEach(function(i){var raw=i.kind==='raw',rg=regFor(c,[i]),r=regAt(rg,d);
h+='<tr><td class="r" style="text-align:left">'+esc(i.name)+(raw?' <small class="note">(raw)</small>':'')+'</td><td class="r">'+esc(i.unit)+'</td><td class="r">'+(raw?'-':r.o)+'</td><td class="r">'+(raw?'-':r.p)+'</td><td class="r">'+(raw?'-':r.tot)+'</td><td class="r">'+(raw?'-':r.s)+'</td><td class="r"><b>'+qtyAt(c,i,d)+'</b></td><td class="r">'+(raw?'-':regMonth(rg,d))+'</td></tr>'});
h+='</table></div>';
us.forEach(function(u){
if(!U[u].prod.length)return;
var rg=regFor(c,U[u].prod),ds=Object.keys(rg.days).sort(),run=rg.base,rows=[];
if(rg.base>0)rows.push('<tr><td class="r" style="text-align:left">Earlier stock</td><td class="r">-</td><td class="r">-</td><td class="r">'+rg.base+'</td><td class="r">-</td><td class="r"><b>'+rg.base+'</b></td></tr>');
ds.forEach(function(k){var x=rg.days[k],tot=run+x.p,end=tot-x.s;
rows.push('<tr><td class="r" style="text-align:left">'+dmy(k)+'</td><td class="r">'+run+'</td><td class="r pos">'+(x.p||'-')+'</td><td class="r"><b>'+tot+'</b></td><td class="r neg">'+(x.s||'-')+'</td><td class="r"><b>'+end+' '+esc(u)+'</b></td></tr>');run=end});
if(!rows.length)return;
h+='<h3>Daily stock register ('+esc(u)+')</h3><div class="sheet"><table style="min-width:560px"><tr><th>Date</th><th>Opening stock</th><th>Produced</th><th>Total (opening + produced)</th><th>Sold / out</th><th>Closing stock</th></tr>'+rows.reverse().join('')+'</table></div>'});
return h+'<p class="note">Total production till today by factory = opening stock (yesterday’s closing stock) + today’s production. Selling or “− Out” never changes it and only lowers In stock. In stock = opening stock + produced − sold / out. Raw materials are not counted in production. This page is calculated, so it cannot be edited.</p>'}

/* ============ RECEIPT MAKER (NEW) ============ */
function rcptTotal(r){
  var sub=(r.items||[]).reduce(function(a,it){return a+num(it.qty)*num(it.rate)},0);
  var disc=Math.min(num(r.discount),sub);
  return (sub-disc)*(1+num(r.taxPct)/100);
}
function nextRcptNo(c){
  var max=0;
  c.rcpt.forEach(function(r){
    var m=String(r.no||'').match(/(\d+)\s*$/);
    if(m)max=Math.max(max,parseInt(m[1],10)||0);
  });
  return 'RCPT-'+pad(max+1);
}
function vRcpt(){
  var c=C();
  if(S.rtab==='form'){
    var r=S.rid?c.rcpt.filter(function(x){return x.id===S.rid})[0]:null;
    if(!r)return '<p class="note">Receipt not found.</p><button class="btn alt full" data-a="backrcpt">Back to list</button>';
    return rcptForm(c,r);
  }
  if(S.rtab==='print'){
    var r2=S.rid?c.rcpt.filter(function(x){return x.id===S.rid})[0]:null;
    if(!r2)return '<p class="note">Receipt not found.</p>';

}

function attPeriod(c,w,a,b){var o={P:0,H:0,A:0,L:0,days:0,base:0};Object.keys(c.att).forEach(function(k){if(k<a||k>b)return;var s=c.att[k][w.id];if(!s)return;o[s]++;var f=s==='P'?1:s==='H'?.5:0;o.days+=f;o.base+=f*num(w.wage)/daysIn(k.slice(0,7))});o.base=rnd(o.base);return o}
function sumK(c,w,a,b,kind){return c.adv.filter(function(x){return x.wid===w.id&&x.k===kind&&x.d>=a&&x.d<=b}).reduce(function(t,x){return t+num(x.amt)},0)}
function sumAdv(c,w,a,b){return c.adv.filter(function(x){return x.wid===w.id&&isAdvK(x)&&x.d>=a&&x.d<=b}).reduce(function(t,x){return t+num(x.amt)},0)}
/* cumulative ledger up to any date, same arithmetic as earned()/advOf()/paidOf() but as of ref instead of today */
function earnedTo(c,w,ref){var e=0,dd=0;Object.keys(c.att).forEach(function(k){if(k>ref)return;var s=c.att[k][w.id];if(!s)return;var f=s==='P'?1:s==='H'?.5:0;dd+=f;e+=f*num(w.wage)/daysIn(k.slice(0,7))});c.adv.forEach(function(a){if(a.wid===w.id&&a.d<=ref&&(a.k==='bonus'||a.k==='ot'))e+=num(a.amt)});return{days:dd,earn:e}}
function advOfTo(c,w,ref){return c.adv.filter(function(x){return x.wid===w.id&&isAdvK(x)&&x.d<=ref}).reduce(function(t,x){return t+num(x.amt)},0)}
function paidOfTo(c,w,ref){return c.adv.filter(function(x){return x.wid===w.id&&x.k==='paid'&&x.d<=ref}).reduce(function(t,x){return t+num(x.net)},0)}
function advListTo(c,w,ref){return c.adv.filter(function(x){return x.wid===w.id&&isAdvK(x)&&x.d<=ref}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0})}
/* full picture for one worker as of any date: all-time earned, all-time advance taken, all-time net salary paid, and what is still pending (not yet cut from a salary) */
function allTime(c,w,ref){var at=attPeriod(c,w,'0000-01-01',ref),e=earnedTo(c,w,ref),adv=advOfTo(c,w,ref),paid=paidOfTo(c,w,ref),
out=c.adv.filter(function(x){return x.wid===w.id&&isAdvK(x)&&x.d<=ref&&!x.s}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0}),
outAmt=rnd(out.reduce(function(t,x){return t+num(x.amt)-num(x.dd||0)},0));
return{at:at,earn:e.earn,adv:adv,paid:paid,bal:rnd(e.earn-adv-paid),out:out,outAmt:outAmt}}
/* default salary period for the pay form: the calendar month right after the last paid period, or the previous (or current) month when nothing has been paid yet */
function payDef(c,wid){var w=c.wrk.filter(function(x){return x.id===wid})[0],t=today(),
paidRows=c.adv.filter(function(x){return x.wid===wid&&x.k==='paid'&&x.pt}).sort(function(a,b){return a.pt<b.pt?1:-1}),from;
if(paidRows.length)from=addDays(paidRows[0].pt,1).slice(0,7)+'-01';
else{var y=+t.slice(0,4),m=+t.slice(5,7);if(w&&sdayOf(w)){m--;if(m<1){m=12;y--}}from=y+'-'+pad2(m)+'-01'}
return{f:from,t:mEnd(from.slice(0,7))}}

function cell(v,r,b){return '<td'+(r?' class="r"':'')+'>'+(b?'<b>':'')+v+(b?'</b>':'')+'</td>'}
function tblh(head,rows,empty){return rows.length?'<table><tr>'+head.map(function(h){return '<th'+(h.charAt(0)==='>'?' class="r"':'')+'>'+esc(h.replace(/^>/,''))+'</th>'}).join('')+'</tr>'+rows.join('')+'</table>':'<p style="font-size:12px;color:#555;margin:2px 0">'+(empty||'None.')+'</p>'}
function kv(rows){return '<table>'+rows.map(function(x){return '<tr><td>'+x[0]+'</td><td class="r">'+(x[2]?'<b>':'')+x[1]+(x[2]?'</b>':'')+'</td></tr>'}).join('')+'</table>'}

/* ---- dues with payment history ---- */
function duesAt(c,d){var L=[];
function add(k,x,total,who,ref,dt,phone){var pays=x.pays||[],ps=pays.reduce(function(s,p){return s+num(p.amt)},0),init=Math.max(0,num(x.paid)-ps),
paidTo=init+pays.filter(function(p){return p.d<=d}).reduce(function(s,p){return s+num(p.amt)},0),due=rnd(total-paidTo),rc=pays.filter(function(p){return p.d===d}).reduce(function(s,p){return s+num(p.amt)},0);
if(dt<=d&&(due>0.004||rc>0))L.push({k:k,who:who,ref:ref,d:dt,total:total,paidTo:paidTo,due:due,rcvd:rc,phone:phone||''})}
c.sal.forEach(function(x){add('s',x,saleTotal(x),x.cust||'Walk-in customer',x.no,x.d,x.phone)});
c.rcpt.forEach(function(x){add('r',x,rcptTotal(x),x.cust||'Customer','Receipt '+(x.no||''),x.d,x.phone)});
(c.due||[]).forEach(function(x){add('m',x,num(x.amt),x.who||'Customer',x.note||'Manual due',x.d,x.phone)});
return L}

+'<p class="note">'+(!o.batches.length?'No product made from this serial yet.':s.unk?'Loss cannot be worked out because the product unit cannot be converted to the raw material unit (use kg or ton).':s.allRu?'Loss is worked out on the raw material actually used ('+fqn(s.used)+' '+esc(o.rawUnit)+'). Not used yet: '+fqn(s.left)+' '+esc(o.rawUnit)+'.':'Loss is worked out on the whole lot ('+fqn(o.rawQty)+' '+esc(o.rawUnit)+'). If you enter “raw used” on each production entry, it is worked out on what was really used.')+'</p>'
+'<h3>Raw material received</h3><div class="sheet"><table style="min-width:460px"><tr><th>Date</th><th>Quantity</th><th>Price/unit</th><th>Total</th></tr>'+o.raws.map(function(m){return '<tr><td class="r" style="text-align:left">'+esc(dmy(m.d))+'</td><td class="r">'+fqn(m.delta)+' '+esc(m.unit)+'</td><td class="r">'+(num(m.rate)>0?money(num(m.rate)):'-')+'</td><td class="r">'+(num(m.rate)>0?money(num(m.delta)*num(m.rate)):'-')+'</td></tr>'}).join('')+(o.rawCost>0?'<tr class="tot"><td colspan="3">Total raw cost of this serial</td><td class="r">'+money(o.rawCost)+'</td></tr>':'')+'</table></div>'
+'<h3>Product made from this serial</h3><div class="sheet"><table style="min-width:520px"><tr><th>Date</th><th>Batch</th><th>Product</th><th>Quantity</th><th>Raw used</th><th>Yield</th></tr>'+(bs.map(function(m){var it=item(c,m.pid),ru=num(m.ru),v=ru>0?conv(num(m.delta),m.unit,o.rawUnit):null;return '<tr><td class="r" style="text-align:left">'+esc(dmy(m.d))+'</td><td class="r">'+esc(m.bn||'-')+'</td><td class="r" style="text-align:left">'+esc(it?it.name:m.name)+'</td><td class="r pos">+'+fqn(m.delta)+' '+esc(m.unit)+'</td><td class="r">'+(ru>0?fqn(ru)+' '+esc(o.rawUnit):'-')+'</td><td class="r">'+(v!=null?(v/ru*100).toFixed(1)+'%':'-')+'</td></tr>'}).join('')||'<tr><td colspan="6" class="r" style="text-align:left">None yet.</td></tr>')+'</table></div>'
+(left?'<h3>Still in stock from this serial</h3>'+left+'<p class="note">Sold / stock-out quantity is taken from the oldest serial first.</p>':'')}

/* ---- salary slips (advance and salary) ---- */

function vSps(){var c=C(),r=c.adv.filter(function(x){return x.id===S.sp})[0];if(!r)return '<p class="note">Slip not found.</p>';
var w=c.wrk.filter(function(x){return x.id===r.wid})[0]||{name:'(removed)'},wn='<div><b>'+esc(w.name)+'</b>'+(w.role?' · '+esc(w.role):'')+'</div>',
out=c.adv.filter(function(a){return a.wid===r.wid&&isAdvK(a)&&!a.s}).reduce(function(t,a){return t+num(a.amt)-num(a.dd)},0),
act='<div class="actions"><button class="btn" data-a="pr">Print / Save as PDF</button><button class="btn alt" data-a="back">Back</button><button class="btn alt" data-a="delsp">Delete slip</button></div>';
if(r.k!=='paid'){var s=allTime(c,w,r.d),al=advListTo(c,w,r.d);
var rows=al.map(function(a){return '<tr>'+cell(esc(dmy(a.d)))+cell(esc(a.note||(a.k==='loan'?'Loan':'Advance')))+cell(a.id===r.id?'<b>'+money(num(a.amt))+'</b>':money(num(a.amt)),1)+'</tr>'});
return '<div id="rcpt"><div class="rh"><b>'+esc(c.name)+'</b><br>'+(r.k==='loan'?'LOAN':'ADVANCE')+' SLIP</div><div class="rm"><span>Date given: '+esc(dmy(r.d))+'</span><span>Amount: '+money(num(r.amt))+'</span></div>'+wn
+hd3('Money taken till this date, date by date')+tblh(['Date','Note','>Amount'],rows)
+kv([['Total taken till this date',money(s.adv),1],['Income earned till this date',money(s.earn)],['Pending (will be cut on the next salary day)',money(out),1]])
+(r.note?'<p style="font-size:12px">Note: '+esc(r.note)+'</p>':'')+'<p style="font-size:12px;margin-top:18px">Worker signature: ____________</p></div>'+act}
var L=c.adv.filter(function(a){return a.wid===r.wid&&isAdvK(a)}).sort(function(a,b){return a.d<b.d?-1:1}),
rows2=L.map(function(a){var pn=r.parts&&r.parts[a.id],st=pn!=null?(a.s&&a.p===r.id?'Deducted now':'Part deducted now: '+money(pn)):(r.ids.indexOf(a.id)>-1?'Deducted now':(a.s?'Deducted earlier':(num(a.dd)>0?'Part deducted earlier':'Pending')));return '<tr><td>'+esc(dmy(a.d))+'</td><td>'+esc(a.note||(a.k==='loan'?'Loan':'Advance'))+'</td><td class="r">'+money(num(a.amt))+'</td><td>'+st+'</td></tr>'}).join('');
return '<div id="rcpt"><div class="rh"><b>'+esc(c.name)+'</b><br>SALARY SLIP, '+esc(r.pf?dmy(r.pf)+' to '+dmy(r.pt):r.m)+'</div><div class="rm"><span>Paid on: '+esc(dmy(r.d))+'</span>'+(sdayOf(w)?'<span>Salary day: '+sdayOf(w)+'</span>':'')+'</div>'+wn+'<table><tr><td>Days present / half day</td><td class="r">'+r.pd+' / '+r.hd+'</td></tr><tr><td>Monthly salary</td><td class="r">'+money(num(w.wage))+'</td></tr><tr><td>Salary for days worked</td><td class="r">'+money(r.base)+'</td></tr><tr><td>Overtime</td><td class="r">'+money(r.ot)+'</td></tr><tr><td>Bonus</td><td class="r">'+money(r.bonus)+'</td></tr><tr><td><b>Total salary</b></td><td class="r"><b>'+money(r.base+r.ot+r.bonus)+'</b></td></tr><tr><td>Advance deducted</td><td class="r">−'+money(r.ded)+'</td></tr></table><div class="rt"><div class="gt"><span>Net received</span><span>'+money(r.net)+'</span></div></div><h3 style="font-size:13px;margin:12px 0 4px">Advance history, date by date</h3>'+(rows2?'<table><tr><th>Date</th><th>Note</th><th class="r">Amount</th><th>Status</th></tr>'+rows2+'</table>':'<p style="font-size:12px">No advances.</p>')+'<p style="font-size:12px">Advance still pending after this payment: '+money(out)+'</p><p style="font-size:12px;margin-top:18px">Worker signature: ____________</p></div>'+act}

lockShow();
