<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Control Panel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#0b0e11;--surface:#1a1e22;--ink:#f2f4f5;--accent:#f5b800;--red:#ff6b61;--green:#4cd185;--line:#2c3238}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,Arial,sans-serif;line-height:1.45;padding:20px}
h1,h2,h3{font-family:"Barlow Condensed",Arial,sans-serif;text-transform:uppercase;margin:0}
.wrap{max-width:900px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--accent);padding-bottom:10px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);padding:15px;margin-bottom:15px}
.btn{background:var(--accent);color:#14171a;border:0;padding:8px 12px;font-weight:700;cursor:pointer;text-transform:uppercase;font-family:"Barlow Condensed";font-size:1rem}
.btn.red{background:var(--red);color:#fff}
.btn.green{background:var(--green);color:#14171a}
.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.row:last-child{border-bottom:0}
.status{padding:4px 8px;font-size:.8rem;font-weight:700;text-transform:uppercase}
.status.active{background:var(--green);color:#000}
.status.suspended{background:var(--red);color:#fff}
.status.pending{background:var(--accent);color:#000}
#login{max-width:400px;margin:100px auto;text-align:center}
input{width:100%;padding:10px;margin-bottom:10px;background:#000;color:#fff;border:1px solid var(--line);font-family:inherit}
</style>
<script src="firebase-config.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚙️ Admin Control Panel</h1>
    <div>
      <button id="refreshBtn" class="btn" style="display:none; margin-right:10px; background:#39414a; color:#fff">Refresh</button>
      <button id="logout" class="btn" style="display:none">Sign Out</button>
    </div>
  </header>

  <div id="login" class="card">
    <h2>Owner Login</h2>
    <input type="email" id="email" placeholder="Admin Email" value="sagorahammad007@gmail.com">
    <input type="password" id="pass" placeholder="Password">
    <button class="btn" style="width:100%" id="loginBtn">Sign In</button>
    <p id="loginErr" style="color:var(--red); margin-top:10px;"></p>
  </div>

  <div id="dash" style="display:none">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px">
      <div class="card"><h3>Total Clients</h3><h2 id="total">0</h2></div>
      <div class="card"><h3>Pending Approval</h3><h2 id="pending" style="color:var(--accent)">0</h2></div>
    </div>
    
    <div class="card">
      <h3>Client Management</h3>
      <div id="users"><p class="note">Loading...</p></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const config = typeof firebaseConfig !== 'undefined' ? firebaseConfig : window.firebaseConfig;
  const app = initializeApp(config);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginBtn = document.getElementById('loginBtn');
  const loginErr = document.getElementById('loginErr');
  const userList = document.getElementById('users');

  loginBtn.addEventListener('click', () => {
      loginErr.innerText = "Signing in...";
      signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value)
        .catch(e => { loginErr.innerText = e.message; });
  });

  document.getElementById('logout').addEventListener('click', () => signOut(auth));
  document.getElementById('refreshBtn').addEventListener('click', () => loadUsers());

  window.approveUser = async (uid) => {
    await updateDoc(doc(db, "users", uid), { status: "active" });
    loadUsers();
  };

  window.suspendUser = async (uid) => {
    if(confirm("Suspend this client? They will be locked out immediately.")) {
      await updateDoc(doc(db, "users", uid), { status: "suspended" });
      loadUsers();
    }
  };

  async function loadUsers() {
    userList.innerHTML = '<p style="color:var(--accent)">Loading data from Firebase...</p>';
    try {
      const querySnapshot = await getDocs(collection(db, "users"));
      let html = '';
      let pending = 0;
      let total = 0;
      
      querySnapshot.forEach((docSnap) => {
        const u = docSnap.data();
        total++;
        if (u.status === 'pending' || !u.status) pending++;
        
        let badge = `<span class="status ${u.status || 'pending'}">${u.status || 'pending'}</span>`;
        let actionBtn = u.status === 'active' 
          ? `<button class="btn red" onclick="suspendUser('${docSnap.id}')">Suspend</button>`
          : `<button class="btn green" onclick="approveUser('${docSnap.id}')">Approve</button>`;

        html += `
          <div class="row">
            <div>
              <b>${u.email || 'No Email'}</b><br>
              <small style="color:var(--line)">Role: ${u.role || 'owner'} | Workspace: ${u.wid || 'None'}</small>
            </div>
            <div style="display:flex;gap:10px;align-items:center">
              ${badge} ${actionBtn}
            </div>
          </div>
        `;
      });

      document.getElementById('total').innerText = total;
      document.getElementById('pending').innerText = pending;
      userList.innerHTML = html || '<p style="color:var(--red)">Firebase returned 0 users. Your Firestore database is empty.</p>';
      
    } catch (err) {
      userList.innerHTML = `<p style="color:var(--red)">Error: ${err.message}<br>Check your Firebase Security Rules.</p>`;
    }
  }

  onAuthStateChanged(auth, (user) => {
    if (user && user.email === 'sagorahammad007@gmail.com') {
      document.getElementById('login').style.display = 'none';
      document.getElementById('dash').style.display = 'block';
      document.getElementById('logout').style.display = 'block';
      document.getElementById('refreshBtn').style.display = 'inline-block';
      loadUsers();
    } else {
      document.getElementById('login').style.display = 'block';
      document.getElementById('dash').style.display = 'none';
      document.getElementById('logout').style.display = 'none';
      document.getElementById('refreshBtn').style.display = 'none';
    }
  });
</script>
</body>
</html>
